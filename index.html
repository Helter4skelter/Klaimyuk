<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reztroid® - Garansi & Bonus Management Dashboard</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti Library untuk Selebrasi -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: {
              purple: '#6d4df6',
              purpleDark: '#5635e8',
              lime: '#bef724',
              limeHover: '#a7e31b',
              lightPurple: '#f4f0ff',
              pillPurple: '#ece5ff',
              pillText: '#6845f5'
            }
          },
          animation: {
            'bounce-short': 'bounceShort 0.5s ease-in-out 1',
            'pulse-glow': 'pulseGlow 2s infinite',
          },
          keyframes: {
            bounceShort: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.03)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f7f9fc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .hero-gradient {
      background: linear-gradient(135deg, #7451f8 0%, #5d36f5 60%, #4b23e8 100%);
      box-shadow: 0 20px 40px -15px rgba(109, 77, 246, 0.45);
    }

    .neon-btn {
      background-color: #bef724;
      color: #0d0f12;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neon-btn:hover {
      background-color: #abeb0c;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -4px rgba(190, 247, 36, 0.5);
    }
    .neon-btn:active { transform: translateY(0); }

    .drop-active {
      border-color: #bef724 !important;
      background: rgba(109, 77, 246, 0.08) !important;
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(190, 247, 36, 0.35) !important;
    }

    .card-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.08);
      border-color: #c7d2fe;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased min-h-screen pb-2
